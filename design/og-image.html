<!doctype html>
<!-- 공유용 대표 이미지(assets/images/og-image.jpg) 원본. Chrome 헤드리스로 1200x630 캡처:
     "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" --headless=new --hide-scrollbars --window-size=1200,630 --virtual-time-budget=8000 --screenshot=og.png design/og-image.html -->
<html lang="ko"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&display=block" rel="stylesheet">
<style>
  html,body{margin:0;width:1200px;height:630px;overflow:hidden}
  body{background:#FDFCFA;color:#43342D;font-family:"Gowun Dodum",sans-serif;
       display:grid;grid-template-columns:1fr 300px;align-items:center;gap:72px;padding:0 104px;box-sizing:border-box;position:relative}
  .copy{font-size:60px;line-height:1.45;letter-spacing:-.01em;margin:0}
  .who{display:flex;align-items:center;gap:14px;font-size:28px;margin-top:44px;color:#43342D}
  .ember{width:14px;height:14px;border-radius:50%;background:#EDC1A8;box-shadow:0 0 0 8px rgba(237,193,168,.22)}
  .who span.soft{color:#94827A;margin-left:10px}
  .photo{width:300px;height:300px;border-radius:50%;overflow:hidden;box-shadow:0 0 0 12px #F6EFEA}
  .photo img{width:100%;height:100%;object-fit:cover;display:block}
  .url{position:absolute;left:104px;bottom:44px;font-size:22px;color:#B3A59E}
  .rule{position:absolute;left:104px;right:104px;bottom:92px;height:1px;background:rgba(67,52,45,.10)}
</style></head>
<body>
  <div>
    <p class="copy">어떤 방식으로든<br>끊임없이 기록하는 사람.</p>
    <div class="who"><span class="ember"></span>작가 온정<span class="soft">『사물을 보는 방식』 저자</span></div>
  </div>
  <div class="photo"><img src="../assets/images/profile.jpg" alt=""></div>
  <div class="rule"></div>
  <div class="url">onjungwriter.github.io</div>
</body></html>
